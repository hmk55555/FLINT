<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 140" width="960" height="140" role="img" aria-label="Fixed Budget: V embeddings per query or document, no matter how long the text is; 5.3 to 9.3 times smaller index than token-level ColBERTv2; 1.5 to 2.8 times faster retrieval than ConstBERT on long queries" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<g transform="translate(0 0)"><rect x="0" y="0" width="310" height="140" rx="10" fill="#f3f4f6"/><text x="20" y="60" fill="#e2731b" font-size="40" font-weight="700">Fixed Budget</text><text x="20" y="94" fill="#1f2328" font-size="15" font-weight="600">V embeddings per query or document</text><text x="20" y="117" fill="#59636e" font-size="13.5">no matter how long the text is</text></g><g transform="translate(325 0)"><rect x="0" y="0" width="310" height="140" rx="10" fill="#f3f4f6"/><text x="20" y="60" fill="#e2731b" font-size="40" font-weight="700">5.3–9.3×</text><text x="20" y="94" fill="#1f2328" font-size="15" font-weight="600">smaller index</text><text x="20" y="117" fill="#59636e" font-size="13.5">than token-level ColBERTv2</text></g><g transform="translate(650 0)"><rect x="0" y="0" width="310" height="140" rx="10" fill="#f3f4f6"/><text x="20" y="60" fill="#e2731b" font-size="40" font-weight="700">1.5–2.8×</text><text x="20" y="94" fill="#1f2328" font-size="15" font-weight="600">faster retrieval</text><text x="20" y="117" fill="#59636e" font-size="13.5">than ConstBERT on long queries</text></g></svg>
